# Securly URL Generator

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>securly url Combiner</title>
</head>
<body>

    <h2>Securly URL Combiner</h2>
    <p>Fill in the parameters below to generate the URL.</p>

    <div>
        <label for="useremail">
            User Email 
            <span style="color: red;">*</span> 
            <span style="color: black; font-weight: normal; font-size: small;">Email will not show up on page, but the URL must have a valid email</span>
        </label><br>
        <textarea id="useremail" rows="1" style="width: 100%;"></textarea>

    </div>
    <br>

    <div>
        <label for="reason">Reason</label><br>
        <textarea id="reason" rows="1" style="width: 100%;"></textarea>
    </div>
    <br>

    <div>
        <label for="categoryid">Category ID</label><br>
        <textarea id="categoryid" rows="1" style="width: 100%;"></textarea>
    </div>
    <br>

    <div>
        <label for="policyid">Policy ID</label><br>
        <textarea id="policyid" rows="1" style="width: 100%;"></textarea>
    </div>

    <br>

    <div>
        <label for="keyword">Keyword (Encoded to Base64)</label><br>
        <textarea id="keyword" rows="1" style="width: 100%;"></textarea>
    </div>
    <br>

    <div>
        <label for="url">Target URL (Encoded to Base64)</label><br>
        <textarea id="url" rows="1" style="width: 100%;"></textarea>
    </div>
    <br>

    <div style="margin-top: 20px; border-top: 1px solid #000; padding-top: 10px;">
        <strong>Generated URL:</strong><br>
        <div id="urlResult" style="word-break: break-all; margin-top: 10px; font-family: monospace;">https://securly.com/blocked</div>
        <br>
        <button id="copyBtn" disabled>Copy URL</button>

        <button id="openBtn" disabled>Open URL</button>
        <span id="copyNotice" style="display: none; color: green; margin-left: 10px;">Copied to clipboard.</span>
    </div>

    <script>
        const fields = ['useremail', 'reason', 'categoryid', 'policyid', 'keyword', 'url'];
        const base64Fields = ['keyword', 'url'];
        const base = "https://securly.com/blocked";
        
        const urlResult = document.getElementById('urlResult');
        const copyBtn = document.getElementById('copyBtn');
        const openBtn = document.getElementById('openBtn');
        const copyNotice = document.getElementById('copyNotice');

        function updateURL() {
            const emailValue = document.getElementById('useremail').value.trim();
            
            // Mandatory check: email must be present to generate the query string
            if (!emailValue) {

                urlResult.textContent = base;
                copyBtn.disabled = true;
                openBtn.disabled = true;
                return;
            }

            copyBtn.disabled = false;
            openBtn.disabled = false;

            let params = [];
            fields.forEach(field => {
                const input = document.getElementById(field);
                let val = input.value.trim();
                
                if (val) {
                    // Encode specific fields to Base64
                    if (base64Fields.includes(field)) {
                        try {
                            val = btoa(val);

                        } catch (e) {
                            console.error("Base64 error");
                        }
                    }
                    
                    // Add parameters WITHOUT URL encoding (no %##) as requested
                    params.push(field + "=" + val);
                }
            });

            const fullURL = base + (params.length > 0 ? "?" + params.join("&") : "");
            urlResult.textContent = fullURL;
        }

        function copyToClipboard() {
            const text = urlResult.textContent;
            const dummy = document.createElement("textarea");
            document.body.appendChild(dummy);
            dummy.value = text;

            dummy.select();
            document.execCommand("copy");
            document.body.removeChild(dummy);
            
            copyNotice.style.display = "inline";
            setTimeout(() => {
                copyNotice.style.display = "none";
            }, 2000);
        }

        function openURL() {
            const text = urlResult.textContent;
            window.open(text, '_blank');
        }

        // Attach listeners to all textareas
        fields.forEach(id => {
            document.getElementById(id).addEventListener('input', updateURL);
        });


        copyBtn.addEventListener('click', copyToClipboard);
        openBtn.addEventListener('click', openURL);

        // Run initially to set the base state
        updateURL();
    </script>

</body>
</html>
